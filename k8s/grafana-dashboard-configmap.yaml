apiVersion: v1
kind: ConfigMap
metadata:
  name: omega-grafana-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1" # This label allows the kube-prometheus-stack Grafana sidecar to auto-discover it
data:
  omega-dashboard.json: |-
    {
      "annotations": { "list": [] },
      "editable": true,
      "panels": [
        {
          "datasource": "Prometheus",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "id": 2,
          "targets": [
            {
              "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"default\"}[5m])) by (pod)",
              "legendFormat": "{{pod}}"
            }
          ],
          "title": "CPU Usage per Pod",
          "type": "timeseries"
        }
      ],
      "refresh": "10s",
      "schemaVersion": 30,
      "style": "dark",
      "time": { "from": "now-1h", "to": "now" },
      "title": "Omega Microservices Dashboard",
      "uid": "omega-001",
      "version": 1
    }
