apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: local-registry:5000/omega-backend:latest
        env:
        - name: DATABASE_URL
          value: "postgresql://user:password@db:5432/omega_db"
        - name: GEMINI_API_KEY
          valueFrom:
            secretKeyRef:
              name: omega-gemini-secret
              key: GEMINI_API_KEY
              optional: true
        - name: GEMINI_MODEL
          valueFrom:
            secretKeyRef:
              name: omega-gemini-secret
              key: GEMINI_MODEL
              optional: true
        ports:
        - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector:
    app: backend
  ports:
  - port: 8000
    targetPort: 8000
